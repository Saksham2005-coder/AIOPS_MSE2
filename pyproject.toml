[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-mlops-monitoring"
version = "0.1.0"
description = "Synthetic model-quality monitoring and retraining demonstration"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
mlflow = ["mlflow>=2.12"]

[tool.setuptools.packages.find]
include = ["mlops_monitoring*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
