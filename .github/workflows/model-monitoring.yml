name: Model monitoring demo

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  monitor-and-retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[test]"

      - name: Create synthetic training and incoming data
        run: python -m mlops_monitoring initialize --output-dir demo_output

      - name: Evaluate, retrain, and apply quality gate
        run: python -m mlops_monitoring run --output-dir demo_output

      - name: Run tests
        run: python -m pytest

      - name: Upload execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: model-monitoring-evidence
          path: demo_output/
